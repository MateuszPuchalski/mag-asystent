# Build natywnej aplikacji Android (android/). Środowiska bez Android SDK
# budują tylko :core (testy JVM) — pełny build APK wymaga SDK, który jest
# preinstalowany na runnerach ubuntu-latest.
name: Android

on:
  push:
    branches: [main]
    # `package.json` korzenia MUSI tu być: z niego bierze się `versionName`
    # i `versionCode` APK. Bez tego sam podbicie wersji nie przebudowywało
    # kolektora i na wydanie szedł plik z numerem sprzed zmiany.
    # `tools/**` jest tu, bo dwie bramki Kotlina to skrypty w Pythonie
    # (`kt_imports_check.py`, `ergonomia_check.py`). Bez tego wpisu zmiana
    # samej bramki przechodziła BEZ jej uruchomienia — ta sama dziura, którą
    # `docs/**` załatało w workflow serwera.
  pull_request:
    # `tools/**` jest tu, bo dwie bramki Kotlina to skrypty w Pythonie
    # (`kt_imports_check.py`, `ergonomia_check.py`). Bez tego wpisu zmiana
    # samej bramki przechodziła BEZ jej uruchomienia — ta sama dziura, którą
    # `docs/**` załatało w workflow serwera.
  # Ręczne uruchomienie — po to, żeby dało się zbudować wydanie BEZ wymyślania
  # zmiany w kodzie. Potrzebne dokładnie raz na instalację: po dodaniu sekretów
  # podpisu nie ma czego wypchnąć, a bez biegu nie powstanie ani APK, ani
  # wydanie, z którego bierze go instalator.
  workflow_dispatch:

jobs:
  build:
    name: Android
    runs-on: ubuntu-latest
    # Zapis potrzebny wyłącznie do utworzenia wydania z APK (krok na końcu).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      # Pełna historia: `git diff` z gałęzią bazową potrzebuje
      # wspólnego przodka, a domyślny płytki klon go nie ma.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Zakres liczymy TYLKO dla PR-a. Przy `push` na `main` i przy wydaniu
      # sprawdzamy zawsze wszystko: tam stoi to, co jedzie do ludzi.
      - name: Zakres zmian
        id: zakres
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "dotyczy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          zmiany=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if printf '%s\n' "$zmiany" | grep -qE '^(android/|tools/|package\.json|\.github/workflows/android\.yml)'; then
            echo "dotyczy=true" >> "$GITHUB_OUTPUT"
          else
            echo "dotyczy=false" >> "$GITHUB_OUTPUT"
            echo "Zmiany nie dotyczą obszaru: kolektor Android. Bramka zielona bez pracy."
          fi
      - uses: actions/setup-java@v4
        if: steps.zakres.outputs.dotyczy == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.zakres.outputs.dotyczy == 'true'
      # Namiastka kompilatora dla brakujących importów — `:app` nie kompiluje
      # się poza CI, więc ta pomyłka wychodziła dopiero tutaj. Tanie, biegnie
      # przed Gradle'em.
      - name: Kontrola importów Kotlina
        if: steps.zakres.outputs.dotyczy == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 tools/kt_imports_check.py
      # Cele dotyku — mierzalna część `docs/ergonomia-magazynu.md`. Tu, a nie
      # w workflow serwera, bo czyta źródła kolektora i razem z nimi się starzeje.
      - name: Kontrola ergonomii kolektora
        if: steps.zakres.outputs.dotyczy == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 tools/ergonomia_check.py
      - name: Testy :core (JVM)
        if: steps.zakres.outputs.dotyczy == 'true'
        run: ./gradlew :core:test
      - name: Testy jednostkowe + APK debug
        if: steps.zakres.outputs.dotyczy == 'true'
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Artefakt APK debug
        if: steps.zakres.outputs.dotyczy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wertis-kolektor-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # ── Wydanie podpisane własnym kluczem (0.52.0) ──────────────────────
      # Wyłącznie na `main`: sekretów nie ma w forkach, więc na PR-ach ten
      # krok padłby na każdym zewnętrznym wkładzie. Podpis jest tu jedyną
      # rzeczą odróżniającą aktualizację WERTIS od dowolnego APK podanego
      # kolektorowi z sieci magazynu — patrz DEPLOY.md §5.
      - name: Klucz podpisu
        if: steps.zakres.outputs.dotyczy == 'true' && (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
        env:
          KLUCZ_B64: ${{ secrets.WERTIS_KEYSTORE_B64 }}
        run: |
          if [ -z "$KLUCZ_B64" ]; then
            echo "::warning::Brak sekretu WERTIS_KEYSTORE_B64 — pomijam wydanie"
            exit 0
          fi
          echo "$KLUCZ_B64" | base64 -d > "$RUNNER_TEMP/wertis.keystore"
          echo "WERTIS_KEYSTORE=$RUNNER_TEMP/wertis.keystore" >> "$GITHUB_ENV"

      - name: APK wydania
        if: steps.zakres.outputs.dotyczy == 'true' && (github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.WERTIS_KEYSTORE != '')
        env:
          WERTIS_KEYSTORE_HASLO: ${{ secrets.WERTIS_KEYSTORE_HASLO }}
          WERTIS_KLUCZ_ALIAS: ${{ secrets.WERTIS_KLUCZ_ALIAS }}
          WERTIS_KLUCZ_HASLO: ${{ secrets.WERTIS_KLUCZ_HASLO }}
        run: ./gradlew :app:assembleRelease

      # Nazwa pliku niesie wersję, bo po niej rozpoznaje ją serwer
      # (`server/src/services/aktualizacja.ts`) — nie po zawartości APK.
      - name: Nazwa z wersją i suma kontrolna
        if: steps.zakres.outputs.dotyczy == 'true' && (github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.WERTIS_KEYSTORE != '')
        working-directory: ${{ github.workspace }}
        run: |
          wersja=$(node -p "require('./package.json').version")
          mkdir -p wydanie
          cp android/app/build/outputs/apk/release/*.apk "wydanie/wertis-kolektor-$wersja.apk"
          cd wydanie && sha256sum "wertis-kolektor-$wersja.apk" > "wertis-kolektor-$wersja.apk.sha256"

      - name: Artefakt APK wydania
        if: steps.zakres.outputs.dotyczy == 'true' && (github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.WERTIS_KEYSTORE != '')
        uses: actions/upload-artifact@v4
        with:
          name: wertis-kolektor-apk
          path: wydanie/*

      # ── Wydanie na GitHubie (0.52.2) ────────────────────────────────────
      # TEN KROK JEST WARUNKIEM DZIAŁANIA CAŁEJ AKTUALIZACJI KOLEKTORÓW,
      # i jego brak był usterką 0.52.0. Instalator bierze APK z
      # `releases/latest/download` (`Get-WertisApk` w instalator/uslugi.ps1),
      # a artefakt Actions leży zupełnie gdzie indziej: wygasa po 90 dniach
      # i nie da się go pobrać bez zalogowania do GitHuba. Producent i odbiorca
      # celowały w dwa różne miejsca, więc `-Aktualizuj` kończył się
      # ostrzeżeniem „Nie udalo sie pobrac APK kolektora".
      #
      # Wydanie powstaje NA KAŻDĄ WERSJĘ, nie na ręczny tag. Serwer aktualizuje
      # się z gałęzi `main` i zaraz potem pyta o APK w numerze, który właśnie
      # zbudował — wydanie robione ręcznie i z opóźnieniem znaczyłoby okno,
      # w którym plik po prostu nie istnieje.
      - name: Wydanie na GitHubie
        if: steps.zakres.outputs.dotyczy == 'true' && (github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.WERTIS_KEYSTORE != '')
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          wersja=$(node -p "require('./package.json').version")
          tag="v$wersja"
          # `|| true` jest tu potrzebne: ten sam numer wersji potrafi wejść na
          # main drugi raz (poprawka scalenia), a istniejący tag ma wtedy
          # dostać nowy plik, nie wywalić builda
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "WERTIS $wersja" \
            --notes "APK kolektora $wersja. Opis zmian: CHANGELOG.md" \
            --latest
          gh release upload "$tag" wydanie/* --clobber
