# Bramka i wydanie instalatora Windows (instalator/).
#
# Instalatora nie da się w CI naprawdę uruchomić — nie ma tu Subiekta, SQL
# Servera ani usług do zarejestrowania. Bramkujemy więc to, co bramkować się
# da: składnię, kodowanie i pełny przebieg sterowania w trybie -DryRun.
# Reszta weryfikacji jest ręczna i opisana w instalator/README.md.
#
# Wszystko leci przez `powershell` (Windows PowerShell 5.1), a nie `pwsh`:
# to jest środowisko, w którym instalator faktycznie działa u klienta —
# zarówno jako .ps1, jak i w środku .exe z ps2exe. Pod pwsh brakuje
# System.Data.SqlClient i błąd wyszedłby dopiero na maszynie z Subiektem.
name: Instalator

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    # `contents: write` jest potrzebne WYŁĄCZNIE ostatniemu krokowi, który
    # dokleja pliki instalatora do wydania. Bez tego `github.token` ma dostęp
    # tylko do odczytu i `gh release upload` kończy się „HTTP 403: Resource not
    # accessible by integration" — a wydanie POWSTAJE, tylko puste. Tak przeszło
    # wydanie z 29.07: tag był, plików przy nim nie było.
    #
    # Uprawnienie jest wypisane jawnie i w komplecie, bo podanie choćby jednego
    # klucza wyłącza wszystkie domyślne. Milcząca lista byłaby tu gorsza od
    # żadnej.
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      # Pełna historia: `git diff` z gałęzią bazową potrzebuje
      # wspólnego przodka, a domyślny płytki klon go nie ma.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Zakres liczymy TYLKO dla PR-a. Przy `push` na `main` i przy wydaniu
      # sprawdzamy zawsze wszystko: tam stoi to, co jedzie do ludzi.
      - name: Zakres zmian
        id: zakres
        # Jawny `bash`: to zadanie ma `defaults.run.shell: powershell`, a ten
        # krok jest skryptem powłoki POSIX. Bez tej linii PowerShell dostałby
        # `[ ... ]` i `>>` i wywrócił bramkę na każdym PR-ze instalatora.
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "dotyczy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          zmiany=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if printf '%s\n' "$zmiany" | grep -qE '^(instalator/|\.github/workflows/instalator\.yml)'; then
            echo "dotyczy=true" >> "$GITHUB_OUTPUT"
          else
            echo "dotyczy=false" >> "$GITHUB_OUTPUT"
            echo "Zmiany nie dotyczą obszaru: instalator Windows. Bramka zielona bez pracy."
          fi

      # UTF-8 bez BOM Windows PowerShell 5.1 czyta jako ANSI — polskie znaki
      # w komunikatach instalatora zamieniłyby się wtedy w krzaki na ekranie
      # osoby, która ma tę instalację przeprowadzić. Wychodzi to dopiero na
      # Windowsie, więc pilnujemy tego tutaj.
      - name: Kodowanie plików (UTF-8 z BOM)
        if: steps.zakres.outputs.dotyczy == 'true'
        run: |
          $bledy = 0
          Get-ChildItem instalator\*.ps1 | ForEach-Object {
            $b = [System.IO.File]::ReadAllBytes($_.FullName)
            if ($b.Length -lt 3 -or $b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) {
              Write-Host "BRAK BOM: $($_.Name)"
              $bledy++
            }
          }
          if ($bledy) { exit 1 }
          Write-Host "Wszystkie skrypty maja UTF-8 BOM."

      - name: Kontrola skladni
        if: steps.zakres.outputs.dotyczy == 'true'
        run: |
          $bledy = 0
          Get-ChildItem instalator\*.ps1 | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e -and $e.Count) {
              Write-Host "BLAD $($_.Name)"
              $e | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
              $bledy += $e.Count
            } else {
              Write-Host "OK   $($_.Name)"
            }
          }
          if ($bledy) { exit 1 }

      # Asercje na logice, którą da się wywołać bez dotykania systemu. Idą
      # PRZED przebiegiem próbnym, bo są tańsze i konkretniejsze — i dlatego,
      # że -DryRun tej klasy błędów nie widzi (patrz komentarz niżej).
      - name: Testy instalatora
        if: steps.zakres.outputs.dotyczy == 'true'
        run: .\instalator\testy.ps1

      # Scalanie sprawdza przy okazji, czy znaczniki MODULY-* nadal są na
      # miejscu i czy scalony plik się parsuje. Kopiuje też URUCHOM.cmd.
      - name: Scalenie do jednego pliku
        if: steps.zakres.outputs.dotyczy == 'true'
        run: .\instalator\build.ps1 -Wyjscie dist\WERTIS-Instalator.ps1

      # Przebieg próbny idzie na SCALONYM pliku, a nie na źródłach — to jest
      # ten artefakt, który dostanie klient. Katalog jest tymczasowy, żeby
      # nawet przy pomyłce w -DryRun nie tknąć niczego pod C:\wertis.
      #
      # UWAGA na zakres tego kroku: -DryRun dowodzi PRZEBIEGU STEROWANIA, nie
      # poprawności kroków — każdy krok wykonawczy siedzi za `Test-DryRun`
      # i jest tu pomijany. Tak przeszła awaria z 27.07 (`New-Item` na
      # korzeniu dysku). Tę klasę błędów łapie krok „Testy instalatora".
      - name: Przebieg probny (-DryRun)
        if: steps.zakres.outputs.dotyczy == 'true'
        run: .\dist\WERTIS-Instalator.ps1 -DryRun -Katalog "$env:RUNNER_TEMP\wertis-proba"

      - name: Przebieg probny instancji dev (-Dev -DryRun)
        if: steps.zakres.outputs.dotyczy == 'true'
        run: .\dist\WERTIS-Instalator.ps1 -DryRun -Dev -Katalog "$env:RUNNER_TEMP\wertis-dev-proba" -Port 3002

      # Bramka -Dev MUSI odmowic na porcie produkcji — takze w przebiegu
      # probnym, bo to pomylka konfiguracji, nie krok wykonawczy.
      - name: Bramka -Dev odmawia portu 3001
        if: steps.zakres.outputs.dotyczy == 'true'
        run: |
          .\dist\WERTIS-Instalator.ps1 -DryRun -Dev -Katalog "$env:RUNNER_TEMP\wertis-dev-zle"
          if ($LASTEXITCODE -eq 0) { throw "-Dev na porcie 3001 mial odmowic" }
          exit 0

      - name: Przebieg probny wariantu demo
        if: steps.zakres.outputs.dotyczy == 'true'
        run: .\dist\WERTIS-Instalator.ps1 -DryRun -Demo -Katalog "$env:RUNNER_TEMP\wertis-demo"

      # Gałąź deinstalacji ma WŁASNY przebieg sterowania i kończy się `exit 0`
      # przed etapem 1 — bez tego kroku nie sprawdzałoby jej nic poza parserem.
      # Katalog celowo wskazuje na nieistniejącą ścieżkę: to jest ten wariant,
      # w którym plan musi ODMÓWIC kasowania, a usługi i tak zejść.
      - name: Przebieg probny deinstalacji (-Odinstaluj -DryRun)
        if: steps.zakres.outputs.dotyczy == 'true'
        run: .\dist\WERTIS-Instalator.ps1 -DryRun -Odinstaluj -Katalog "$env:RUNNER_TEMP\wertis-nieistnieje"

      # Wariant, w którym plan ZGADZA SIĘ na kasowanie — a to jedyna droga do
      # skanowania procesów trzymających katalog. Podrobiona instalacja musi
      # nieść oba znamiona (server\ oraz wertis.env), inaczej bramka odmówi
      # i krok znowu przejdzie obok badanego kodu.
      #
      # Wartość jest w Get-Process na PRAWDZIWEJ tablicy procesów: część z nich
      # nie oddaje .Path (brak praw), a to wywracało pierwszą wersję tego kodu.
      # Testy jednostkowe podają listę atrapą i tej klasy błędu nie zobaczą.
      # Nic tu nie ginie — Stop-Process siedzi za `Test-DryRun`.
      - name: Przebieg probny deinstalacji na podrobionej instalacji
        if: steps.zakres.outputs.dotyczy == 'true'
        run: |
          $k = "$env:RUNNER_TEMP\wertis-do-kasowania"
          New-Item -ItemType Directory -Force -Path "$k\server" | Out-Null
          Set-Content -Path "$k\wertis.env" -Value "SGT_MODE=seeded"
          .\dist\WERTIS-Instalator.ps1 -DryRun -Odinstaluj -Katalog $k
          if (-not (Test-Path $k)) { throw "-DryRun skasowal katalog - to mial byc przebieg probny" }

      # Instalator pobiera nssm.exe i uruchamia go jako SYSTEM, więc suma
      # kontrolna jest jedyną rzeczą stojącą między klientem a podmienionym
      # plikiem. Wartości nie dało się ustalić przy pisaniu kodu (brak dostępu
      # do nssm.cc), a wpisanie jej z pamięci dałoby weryfikację POZORNĄ.
      # Ten krok liczy ją na maszynie, która ten adres widzi.
      - name: Suma kontrolna NSSM
        if: steps.zakres.outputs.dotyczy == 'true'
        run: |
          # `continue-on-error` tu NIE MA i to jest celowe: z wpisaną sumą ten
          # krok ma ZATRZYMAĆ budowę przy niezgodności, inaczej strażnik jest
          # bezzębny. Rozdzielone są za to dwa różne zdarzenia — niedostępna
          # sieć to nie jest to samo, co podmieniony plik, i tylko drugie
          # zasługuje na czerwone CI.
          $zip = "$env:RUNNER_TEMP\nssm.zip"
          try {
            Invoke-WebRequest -Uri "https://nssm.cc/release/nssm-2.24.zip" -OutFile $zip -UseBasicParsing
          } catch {
            Write-Host "::warning::nssm.cc niedostepne ($($_.Exception.Message)) - pomijam sprawdzenie sumy."
            exit 0
          }
          $suma = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $kod = Get-Content instalator\uslugi.ps1 -Raw
          if ($kod -notmatch '\$script:SUMA_NSSM_ZIP\s*=\s*"([0-9a-fA-F]*)"') {
            throw "Nie znalazlem stalej SUMA_NSSM_ZIP w uslugi.ps1"
          }
          $oczekiwana = $Matches[1].ToLowerInvariant()
          if (-not $oczekiwana) {
            Write-Host "::warning::Suma NSSM nie jest jeszcze zapisana. Wpisz do instalator/uslugi.ps1: $suma"
          } elseif ($oczekiwana -ne $suma) {
            # Albo nssm.cc wydało nową binarkę, albo ktoś podmienił plik.
            # Jedno i drugie wymaga OCZU CZŁOWIEKA, nie cichej aktualizacji.
            throw "SUMA NSSM SIE ZMIENILA. W repo: $oczekiwana, pobrana: $suma"
          } else {
            Write-Host "Suma NSSM zgodna: $suma"
          }

      - name: Budowa .exe
        if: steps.zakres.outputs.dotyczy == 'true'
        run: |
          Install-Module -Name ps2exe -Force -Scope CurrentUser -AllowClobber
          Import-Module ps2exe
          Invoke-ps2exe -inputFile dist\WERTIS-Instalator.ps1 -outputFile dist\WERTIS-Instalator.exe `
            -title "WERTIS - instalator" `
            -description "Instalator serwera WERTIS dla maszyny z Subiektem GT" `
            -company "WERTIS" -product "WERTIS" -requireAdmin
          if (-not (Test-Path dist\WERTIS-Instalator.exe)) { throw "ps2exe nie wyprodukowal pliku .exe" }

      - name: Artefakt
        if: steps.zakres.outputs.dotyczy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wertis-instalator
          path: |
            dist/WERTIS-Instalator.exe
            dist/WERTIS-Instalator.ps1
            dist/URUCHOM.cmd

      # Do wydania idą TRZY pliki. .exe jest wygodniejszy, ale niepodpisany —
      # gdy polityka firmy albo antywirus go zablokuje, .ps1 jest drogą
      # wyjścia, a nie awaryjnym półśrodkiem (to dokładnie ten sam kod).
      - name: Dolaczenie do wydania
        if: steps.zakres.outputs.dotyczy == 'true' && (github.event_name == 'release')
        run: gh release upload "$env:GITHUB_REF_NAME" dist\WERTIS-Instalator.exe dist\WERTIS-Instalator.ps1 dist\URUCHOM.cmd --clobber
        env:
          GH_TOKEN: ${{ github.token }}
