# Sygnalizacja konfliktów po scaleniu (0.194.0).
#
# Konfliktów NIE rozstrzygamy automatycznie i to jest decyzja poparta liczbami
# z tego repozytorium: trzy najgroźniejsze defekty ostatnich wydań przeszły
# z ZIELONYM CI, a dwa z nich BEZ ŻADNEGO konfliktu. Podwójna definicja
# `zadanie_terenowe` (0.142.0) scaliła się bez jednego znacznika, bo przy
# `CREATE TABLE IF NOT EXISTS` wygrywa definicja wcześniejsza. Konflikt nie
# jest miarą ryzyka — jego brak bywa groźniejszy.
#
# Ten workflow tylko CZYTA i ETYKIETUJE. Niczego nie wypycha do gałęzi:
# odświeżanie gałęzi robi GitHub w ramach auto-scalania, gdy w regule ochrony
# `main` włączone jest „Require branches to be up to date before merging".
name: Konflikty

on:
  push:
    branches: [main]

jobs:
  oznacz:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Oznacz PR-y, które przestały się scalać
        env:
          GH_TOKEN: ${{ github.token }}
          ETYKIETA: konflikt
        run: |
          set -euo pipefail

          gh label create "$ETYKIETA" --color D93F0B \
            --description "Gałąź nie scala się z main — wymaga człowieka" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

          cat > /tmp/komentarz.md <<'TRESC'
          Ta gałąź przestała się scalać z `main` i **nie zostanie scalona automatycznie**.

          Konfliktów nie rozstrzygamy automatem. W tym repozytorium rozstrzygnięcia
          wymagały czytania schematu bazy i tras, a raz napisania zmiany od nowa —
          dlatego ten krok zatrzymuje się na ostrzeżeniu. Wciągnij `main` do gałęzi
          i rozstrzygnij konflikt ręcznie.

          ---
          _Generated by [Claude Code](https://claude.com/claude-code)_
          TRESC
          sed -i 's/^          //' /tmp/komentarz.md

          # `mergeable` GitHub liczy leniwie: zaraz po push bywa `UNKNOWN`.
          # Bez tej pauzy uznalibyśmy za czyste PR-y, których jeszcze nie
          # policzono — czyli dokładnie te, o których mamy ostrzegać.
          sleep 20

          gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,mergeable,labels \
            --jq '.[] | "\(.number) \(.mergeable) \(([.labels[].name] | index(env.ETYKIETA)) != null)"' \
            > /tmp/pr.txt

          while read -r numer stan ma_etykiete; do
            [ -n "$numer" ] || continue
            if [ "$stan" = "CONFLICTING" ] && [ "$ma_etykiete" = "false" ]; then
              gh pr edit "$numer" --add-label "$ETYKIETA" --repo "$GITHUB_REPOSITORY"
              gh pr comment "$numer" --body-file /tmp/komentarz.md --repo "$GITHUB_REPOSITORY"
              echo "#$numer: oznaczony jako konflikt"
            elif [ "$stan" = "MERGEABLE" ] && [ "$ma_etykiete" = "true" ]; then
              gh pr edit "$numer" --remove-label "$ETYKIETA" --repo "$GITHUB_REPOSITORY"
              echo "#$numer: konflikt zniknął, etykieta zdjęta"
            fi
          done < /tmp/pr.txt
