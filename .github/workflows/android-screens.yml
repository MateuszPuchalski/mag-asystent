name: Ekrany kolektora
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Zakres zmian
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            changes=$(git diff --name-only "origin/$BASE_REF...HEAD")
            if grep -qE '^(android/|tools/wms-android-screens\.sh|\.github/workflows/android-screens\.yml)' <<< "$changes"; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-java@v4
        if: steps.scope.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.scope.outputs.run == 'true'
      - name: Dostęp emulatora do KVM
        if: steps.scope.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Przyjęcie i odkładanie na małym ekranie Androida
        if: steps.scope.outputs.run == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, przypięty commit
        with:
          api-level: 29
          target: default
          arch: x86_64
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          disable-spellchecker: true
          working-directory: android
          script: bash ../tools/wms-android-screens.sh
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: wms-native-screen-evidence
          retention-days: 14
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/wms-screen-evidence/
