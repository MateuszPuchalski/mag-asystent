# Bramka dla serwera i dokumentacji. Do tej pory jedynym workflow był Android
# z `paths: ["android/**"]`, więc testy serwera, kontrola typów i spójność
# dokumentacji nie bramkowały niczego — przechodziły tylko wtedy, gdy ktoś
# uruchomił je u siebie.
#
# `docs/**` jest na liście, bo `docs_check.py` skanuje `docs/*.md` — bez tego
# wpisu zmiana wyłącznie w dokumentacji przechodziła BEZ ŻADNEGO sprawdzenia,
# czyli dokładnie tam, gdzie ta kontrola miała pracować. Wyszło to na PR-ze
# zmieniającym jeden plik w `docs/`: zero uruchomionych zadań.
name: Serwer

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "panel/**"
      - "tools/**"
      - "package.json"
      - "README.md"
      - "android/README.md"
      - "instalator/README.md"
      - "DEPLOY.md"
      - "CHANGELOG.md"
      - "docs/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "panel/**"
      - "tools/**"
      - "package.json"
      - "README.md"
      - "android/README.md"
      - "instalator/README.md"
      - "DEPLOY.md"
      - "CHANGELOG.md"
      - "docs/**"
      - ".github/workflows/server.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # repo jest npm workspace (`workspaces: ["server","panel"]`), więc lockfile
      # i instalacja są w korzeniu — `npm ci` w server/ nie miałby czego użyć
      - name: Instalacja zależności
        # Przeglądarek Playwrighta CI nie pobiera: testy end-to-end biegną na
        # razie lokalnie, a `npm ci` bez tej zmiennej ściągałby kilkaset
        # megabajtów przy każdym przebiegu, żeby ich nie użyć.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: Kontrola typów
        working-directory: server
        run: npx tsc --noEmit -p tsconfig.json
      - name: Testy jednostkowe
        working-directory: server
        run: npm test
      # Testy frontu (Vitest + Testing Library). Do 0.146.0 panel nie miał ich
      # wcale, więc błąd w nim wychodził dopiero na ekranie u kogoś w biurze.
      - name: Testy panelu obsługi
        run: npm -w @wertis/panel-obslugi run test
      # Build całego monorepo: panel (Vite) i serwer (tsconfig.build.json).
      # Do 0.143.1 nie robił tego nikt — kontrola typów wyżej używa konfiguracji
      # deweloperskiej, więc błąd w panelu albo w buildzie serwera wychodził
      # dopiero przy wdrożeniu, po `git pull` na produkcji.
      - name: Build panelu i serwera
        run: npm run build
      # docs_check pilnuje, żeby liczby w README (ekrany, trasy, testy) nie
      # rozjechały się z kodem — bez tego dokumentacja starzeje się po cichu.
      - name: Spójność dokumentacji
        run: python3 tools/docs_check.py
      # styl_check mierzy to, co da się zmierzyć z reguł `docs/slownik.md`:
      # długość zdania i akapitu oraz odrzucone warianty terminów. Bez pomiaru
      # styl wraca do stanu wyjściowego przy pierwszym PR — tak samo jak liczby
      # w README zestarzały się, zanim powstał docs_check.
      - name: Styl dokumentacji
        run: python3 tools/styl_check.py
