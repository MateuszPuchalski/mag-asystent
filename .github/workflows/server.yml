# Bramka dla serwera i dokumentacji. Do tej pory jedynym workflow był Android
# z `paths: ["android/**"]`, więc testy serwera, kontrola typów i spójność
# dokumentacji nie bramkowały niczego — przechodziły tylko wtedy, gdy ktoś
# uruchomił je u siebie.
#
# Od 0.194.0 filtr ścieżek NIE stoi na wyzwalaczu, tylko na krokach. Powód jest
# mechaniczny: wymagany check, którego workflow nie ruszył, zostaje w GitHubie
# w stanie oczekiwania NA ZAWSZE i blokuje scalenie. Bez tej zmiany nie da się
# uczynić żadnego checka wymaganym, a bez wymaganych checków automatyczne
# scalanie wpuszcza na `main` zmianę, której nikt nie sprawdził.
name: Serwer

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Serwer
    runs-on: ubuntu-latest
    steps:
      # Pełna historia: `git diff` z gałęzią bazową potrzebuje wspólnego
      # przodka, a domyślny płytki klon go nie ma.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Zakres liczymy TYLKO dla PR-a. Na `main` sprawdzamy zawsze wszystko:
      # tam stoi wydanie, więc oszczędzanie minut runnera jest złym handlem.
      - name: Zakres zmian
        id: zakres
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "dotyczy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          zmiany=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if printf '%s\n' "$zmiany" | grep -qE '^(server/|panel/|tools/|docs/|package\.json|README\.md|android/README\.md|instalator/README\.md|DEPLOY\.md|CHANGELOG\.md|\.github/workflows/server\.yml|\.github/actions/)'; then
            echo "dotyczy=true" >> "$GITHUB_OUTPUT"
          else
            echo "dotyczy=false" >> "$GITHUB_OUTPUT"
            echo "Zmiany nie dotyczą serwera ani dokumentacji — bramka zielona bez pracy."
          fi
      # repo jest npm workspace (`workspaces: ["server","panel"]`), więc lockfile
      # i instalacja są w korzeniu — `npm ci` w server/ nie miałby czego użyć.
      #
      # Od 0.198.1 stoi tu wspólna akcja zamiast `setup-node` z `cache: npm`.
      # Tamto trzymało katalog pobrań, a nie drzewo, więc `npm ci` i tak
      # rozpakowywał 372 MB przy każdym przebiegu: 7 min 03 s z 8 min 59 s
      # całej bramki. Powód, dla którego klucz nie jest sumą lockfile'a, stoi
      # w samej akcji — to najważniejsza część tamtej zmiany.
      - name: Zależności Node
        if: steps.zakres.outputs.dotyczy == 'true'
        uses: ./.github/actions/zaleznosci
      - name: Kontrola typów
        if: steps.zakres.outputs.dotyczy == 'true'
        working-directory: server
        run: npx tsc --noEmit -p tsconfig.json
      - name: Testy jednostkowe
        if: steps.zakres.outputs.dotyczy == 'true'
        working-directory: server
        run: npm test
      # Testy frontu (Vitest + Testing Library). Do 0.146.0 panel nie miał ich
      # wcale, więc błąd w nim wychodził dopiero na ekranie u kogoś w biurze.
      - name: Testy panelu obsługi
        if: steps.zakres.outputs.dotyczy == 'true'
        run: npm -w @wertis/panel-obslugi run test
      # Build całego monorepo: panel (Vite) i serwer (tsconfig.build.json).
      # Do 0.143.1 nie robił tego nikt — kontrola typów wyżej używa konfiguracji
      # deweloperskiej, więc błąd w panelu albo w buildzie serwera wychodził
      # dopiero przy wdrożeniu, po `git pull` na produkcji.
      - name: Build panelu i serwera
        if: steps.zakres.outputs.dotyczy == 'true'
        run: npm run build
      # docs_check pilnuje, żeby liczby w README (ekrany, trasy, testy) nie
      # rozjechały się z kodem — bez tego dokumentacja starzeje się po cichu.
      - name: Spójność dokumentacji
        if: steps.zakres.outputs.dotyczy == 'true'
        run: python3 tools/docs_check.py
      # styl_check mierzy to, co da się zmierzyć z reguł `docs/slownik.md`:
      # długość zdania i akapitu oraz odrzucone warianty terminów. Bez pomiaru
      # styl wraca do stanu wyjściowego przy pierwszym PR — tak samo jak liczby
      # w README zestarzały się, zanim powstał docs_check.
      - name: Styl dokumentacji
        if: steps.zakres.outputs.dotyczy == 'true'
        run: python3 tools/styl_check.py
