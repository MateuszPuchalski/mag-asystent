.pytanie{border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;background:#f8fafc;padding:6px 8px;font-size:12px;font-weight:700;color:#334155}
.plak{border-radius:4px;padding:2px 6px;font-size:11px;line-height:16px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.syg{border-radius:4px;padding:2px 6px;font-size:12px;font-weight:700;white-space:nowrap}
.s-zle{background:#fee2e2;color:#b91c1c}.s-uwaga{background:#fef3c7;color:#92400e}.s-ok{background:#d1fae5;color:#065f46}.s-nic{background:#f1f5f9;color:#475569}.s-info{background:#e0f2fe;color:#075985}.s-ty{background:#d1fae5;color:#065f46}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:700;white-space:nowrap}
.btn-p{background:#F7A600;color:#2A2A2C}.btn-s{background:#fff;border:1px solid #cbd5e1;color:#0f172a}
.btn-m{padding:4px 10px;font-size:12px}
.pole{border:1px solid #cbd5e1;border-radius:8px;padding:6px 10px;font-size:14px;background:#fff;color:#94a3b8;box-sizing:border-box}
.pozioma{display:flex;align-items:center;gap:8px}
.drobne{font-size:12px;color:#64748b}.tekst{font-size:14px;color:#334155}
.sekcja{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#64748b}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:12px;font-weight:700;color:#64748b;padding:6px 10px;border-bottom:1px solid #e2e8f0;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #e2e8f0;vertical-align:top;font-size:14px}
tr:last-child td{border-bottom:0}
.pasek{height:6px;background:#e2e8f0;border-radius:6px;overflow:hidden}.pasek i{display:block;height:6px;background:#F7A600}.pasek.done i{background:#059669}
.foto{border-radius:8px;background:#e2e8f0;display:grid;place-items:center;color:#94a3b8}
.kafel{flex:1;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px}.kafel b{display:block;font-size:24px;line-height:28px;font-variant-numeric:tabular-nums}
